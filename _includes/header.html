<!-- Header -->
<header>
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <img class="img-responsive" src="img/profile.png" alt="profile-pic" />
        <div class="intro-text">
          <span class="name">{{ site.title }}</span>
          <hr class="star-light" />
          <div class="header-social text-center">
            <ul class="list-inline">
              {% for item in site.sections %}
              <li class="list-inline-item">
                <a href="{{ item.url }}" class="btn-social btn-outline" title="{{ item.title | capitalize }}">
                  <i class="{{ item.symbol }} fa-fw"></i>
                </a>
              </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
